<style>
:root{
  --paper:#f5f5f1;--card:#fff;--ink:#1f2328;--muted:#59606a;--line:#dadcd5;
  --teal:#2f5d8a;--teal-soft:#e6edf4;--gold:#a8730f;--gold-soft:#f6eedc;
  --good:#2f7a51;--good-soft:#e3f0e7;--bad:#b0443a;--bad-soft:#f7e6e3;
  --violet:#5e5592;--violet-soft:#ecebf4;--orange:#b4612a;--orange-soft:#f6e9df;--gray-soft:#eeefea;
  --c1:#2f5d8a;--c2:#c07a2c;--c3:#2f7a51;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:14px;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#16181b;--card:#1f2226;--ink:#e8e8e5;--muted:#aeb3ba;--line:#363a40;
  --teal:#8fb3d9;--teal-soft:#25303c;--gold:#d9b26a;--gold-soft:#332b1c;
  --good:#7fc39a;--good-soft:#1f3227;--bad:#e08d84;--bad-soft:#3a2523;
  --violet:#ada6d6;--violet-soft:#2a2838;--orange:#dba27c;--orange-soft:#35281f;--gray-soft:#2a2d32;
  --c1:#8fb3d9;--c2:#e0a868;--c3:#7fc39a;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#16181b;--card:#1f2226;--ink:#e8e8e5;--muted:#aeb3ba;--line:#363a40;
  --teal:#8fb3d9;--teal-soft:#25303c;--gold:#d9b26a;--gold-soft:#332b1c;
  --good:#7fc39a;--good-soft:#1f3227;--bad:#e08d84;--bad-soft:#3a2523;
  --violet:#ada6d6;--violet-soft:#2a2838;--orange:#dba27c;--orange-soft:#35281f;--gray-soft:#2a2d32;
  --c1:#8fb3d9;--c2:#e0a868;--c3:#7fc39a;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{direction:rtl;scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:calc(17px * var(--fs,1));line-height:1.85;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
a{color:var(--teal)}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.4;margin:0;text-wrap:balance}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.wrap{max-width:900px;margin:0 auto;padding:12px 16px 120px}
/* top bar */
.bar{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.bar .in{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:8px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:600;font-size:19px;color:var(--teal);margin-inline-end:auto;text-decoration:none}
.brand svg{width:28px;height:28px;flex:none}
.stat{display:flex;align-items:center;gap:5px;font-weight:600;padding:4px 11px;border-radius:999px;background:var(--gray-soft);font-size:15px}
.stat svg{width:17px;height:17px}
.stat.xp{color:var(--gold)}.stat.fire{color:var(--orange)}
.ibtn{border:1px solid var(--line);background:var(--card);border-radius:10px;min-width:38px;height:36px;padding:0 9px;font-weight:700;display:grid;place-items:center}
.ibtn svg{width:18px;height:18px}
/* tabs */
.tabs{display:flex;gap:6px;margin:14px 0}
.tab{flex:1;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 4px;font-weight:600;font-size:15px;display:flex;gap:6px;align-items:center;justify-content:center}
.tab svg{width:19px;height:19px}
.tab[aria-selected="true"]{background:var(--teal);border-color:var(--teal);color:var(--card)}
@media (max-width:680px){
  .tabs{position:fixed;inset:auto 0 0 0;margin:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:5px 6px calc(5px + env(safe-area-inset-bottom,0px))}
  .tab{flex-direction:column;gap:1px;border:none;font-size:12.5px;padding:6px 2px}
  .tab svg{width:23px;height:23px}
  .brand span{display:none}
}
/* generic */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.panel>h3{font-size:18px;margin-bottom:10px;display:flex;gap:8px;align-items:center}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:none;border-radius:12px;padding:11px 20px;min-height:46px;font-weight:600;background:var(--teal);color:var(--card);box-shadow:0 4px 0 color-mix(in srgb,var(--teal) 60%,#000);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--teal) 60%,#000)}
.btn.ghost{background:var(--gray-soft);color:var(--ink);box-shadow:0 3px 0 var(--line)}
.btn.gold{background:var(--gold);box-shadow:0 4px 0 color-mix(in srgb,var(--gold) 60%,#000)}
.btn.sm{min-height:36px;padding:6px 14px;font-size:15px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;gap:5px;align-items:center;font-size:13.5px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--teal-soft);color:var(--teal)}
.chip.gold{background:var(--gold-soft);color:var(--gold)}.chip.good{background:var(--good-soft);color:var(--good)}.chip.bad{background:var(--bad-soft);color:var(--bad)}
/* hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;background:var(--card);border:1px solid var(--line);border-top:5px solid var(--teal);border-radius:var(--r);padding:20px;margin-bottom:14px}
.hero h1{font-size:clamp(23px,5vw,31px)}
.hero p{margin:4px 0 12px;color:var(--muted)}
.ring{width:104px;height:104px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.ring .c b{font-family:var(--f-display);font-size:24px}
.ring .c small{color:var(--muted);font-size:12px}
@media (max-width:480px){.hero{grid-template-columns:1fr;justify-items:center;text-align:center}.hero .row{justify-content:center}}
/* path */
.unit{margin:22px 0 10px;background:var(--teal-soft);border-radius:12px;padding:10px 14px;display:flex;gap:12px;align-items:center}
.unit .n{font-family:var(--f-display);font-weight:600;background:var(--teal);color:var(--card);width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none}
.unit b{font-family:var(--f-display);font-weight:600;color:var(--teal);font-size:18px;display:block}
.unit small{color:var(--muted);font-size:14.5px}
.node{display:flex;align-items:center;gap:14px;width:100%;background:none;border:none;text-align:start;padding:5px 2px}
.disc{flex:none;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--teal);color:var(--card);box-shadow:0 5px 0 color-mix(in srgb,var(--teal) 55%,#000);font-family:var(--f-display);font-weight:600;font-size:20px;position:relative;transition:transform .12s}
.node:hover .disc{transform:translateY(-2px)}
.node.done .disc{background:var(--good);box-shadow:0 5px 0 color-mix(in srgb,var(--good) 55%,#000)}
.node.current .disc::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:3px solid var(--gold)}
.disc svg{width:26px;height:26px}
.node .meta{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.node .meta b{display:block;font-family:var(--f-display);font-weight:500;font-size:17px;line-height:1.5}
.node .meta small{color:var(--muted);font-size:14px}
/* lesson */
.back{background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--teal);font-weight:600;padding:6px 14px;margin-bottom:10px;display:inline-flex;gap:6px;align-items:center}
.lhead{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.lhead h2{font-size:clamp(20px,4.4vw,26px);margin:4px 0}
.en{direction:ltr;text-align:right;color:var(--muted);font-size:14px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
.sec>button{width:100%;display:flex;align-items:center;gap:10px;padding:13px 16px;background:none;border:none;text-align:start;font-weight:600;font-size:17px}
.sec>button .ck{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:var(--card)}
.sec.read>button .ck{background:var(--good);border-color:var(--good)}
.sec>button .ck svg{width:15px;height:15px}
.sec>button .t{flex:1}
.sec>button .arr{transition:transform .2s;color:var(--muted)}
.sec.open>button .arr{transform:rotate(180deg)}
.sec .body{padding:2px 16px 16px;border-top:1px solid var(--line)}
.prose p{margin:.65em 0}
.prose h4{color:var(--teal);font-size:17px;margin:1.1em 0 .3em;font-weight:500}
.prose ul,.prose ol{padding-inline-start:1.3em;margin:.5em 0}
.prose li{margin:.3em 0}
.f{direction:ltr;text-align:center;font-family:var(--f-mono);background:var(--gray-soft);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:16.5px;overflow-x:auto;white-space:nowrap}
.f small{display:block;font-family:var(--f-body);direction:rtl;color:var(--muted);font-size:13.5px;white-space:normal}
.box{border-radius:12px;padding:10px 14px;margin:12px 0;border-inline-start:5px solid var(--c);background:var(--s)}
.box>b:first-child{color:var(--c);display:block;margin-bottom:2px}
.box.note{--c:var(--teal);--s:var(--teal-soft)}.box.tip{--c:var(--good);--s:var(--good-soft)}
.box.warn{--c:var(--orange);--s:var(--orange-soft)}.box.ex{--c:var(--violet);--s:var(--violet-soft)}
.tw{overflow-x:auto;margin:10px 0;border:1px solid var(--line);border-radius:10px;max-width:100%;background:var(--card)}
.tw table{border-collapse:collapse;width:100%;font-size:15.5px;line-height:1.55}
.tw th{background:var(--teal);color:var(--card);font-weight:600;padding:7px 9px;text-align:start;white-space:nowrap}
.tw td{padding:6px 9px;border-top:1px solid var(--line);vertical-align:top}
.tw tr:nth-child(even) td{background:var(--gray-soft)}
.tw td.n,.tw th.n{font-family:var(--f-mono);direction:ltr;text-align:center}
.tw tr.hl td{background:var(--gold-soft)!important;font-weight:700}
.tw tfoot td{font-weight:700;background:var(--teal-soft)!important}
.lfoot{position:sticky;bottom:0;padding:12px 0;display:flex;gap:10px;flex-wrap:wrap;background:linear-gradient(transparent,var(--paper) 35%)}
@media (max-width:680px){.lfoot{bottom:calc(60px + env(safe-area-inset-bottom,0px))}}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:10px 0}
.fig{background:var(--gray-soft);border-radius:10px;padding:8px;text-align:center;font-size:14.5px}
.fig svg{width:100%;height:auto;display:block}
/* grids */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.pcard{background:var(--card);border:1px solid var(--line);border-bottom-width:4px;border-radius:var(--r);padding:16px;text-align:start;display:flex;flex-direction:column;gap:6px;transition:transform .12s}
.pcard:hover{transform:translateY(-2px)}
.pcard .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--s,var(--teal-soft));color:var(--c,var(--teal))}
.pcard .ic svg{width:24px;height:24px}
.pcard b{font-family:var(--f-display);font-weight:500;font-size:17px}
.pcard span{color:var(--muted);font-size:15px;line-height:1.6}
/* lab */
.seg{display:flex;gap:4px;background:var(--gray-soft);padding:4px;border-radius:12px;margin-bottom:12px;flex-wrap:wrap}
.seg button{flex:1;border:none;background:none;border-radius:9px;padding:8px 10px;font-weight:600;font-size:15px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--teal);box-shadow:0 1px 3px rgba(0,0,0,.12)}
label.fl{display:block;font-weight:600;font-size:15px;margin:8px 0 4px}
textarea,input[type=number],input[type=text],select{width:100%;border:2px solid var(--line);background:var(--card);border-radius:10px;padding:9px 12px}
textarea{min-height:76px;direction:ltr;text-align:left;font-family:var(--f-mono);resize:vertical}
input[type=number]{direction:ltr;text-align:left;font-family:var(--f-mono)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:600px){.g2{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.kpi small{color:var(--muted);font-size:13.5px;display:block;line-height:1.4}
.kpi b{font-family:var(--f-mono);font-size:20px;direction:ltr;display:block;text-align:right}
.kpi.hl{border-color:var(--gold);background:var(--gold-soft)}
.verdict{border-radius:12px;padding:12px 14px;margin:12px 0;font-weight:600}
.verdict.ok{background:var(--good-soft);color:var(--good)}.verdict.no{background:var(--bad-soft);color:var(--bad)}.verdict.mid{background:var(--gold-soft);color:var(--gold)}
.apa{background:var(--violet-soft);border-radius:12px;padding:12px 14px;margin:12px 0;position:relative}
.apa b{color:var(--violet)}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-body);font-size:11px}
.sorted{display:flex;flex-wrap:wrap;gap:4px;direction:ltr;margin:8px 0}
.sorted span{font-family:var(--f-mono);font-size:14px;padding:2px 8px;border-radius:7px;background:var(--gray-soft);position:relative}
.sorted span i{display:block;font-style:normal;font-size:10px;color:var(--muted);text-align:center;line-height:1}
.sorted span.q{background:var(--gold-soft);outline:2px solid var(--gold)}
.sorted span.m{background:var(--teal-soft);outline:2px solid var(--teal)}
details.steps{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:10px 0}
details.steps summary{cursor:pointer;font-weight:600;color:var(--teal)}
/* quiz overlay */
.ov{position:fixed;inset:0;z-index:40;background:var(--paper);overflow-y:auto}
.ov .in{max-width:720px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.qtop{display:flex;align-items:center;gap:12px}
.qtop .x{background:none;border:none;color:var(--muted);padding:4px}
.qtop .x svg{width:26px;height:26px}
.qprog{flex:1;height:13px;border-radius:13px;background:var(--line);overflow:hidden}
.qprog i{display:block;height:100%;background:var(--good);transition:width .35s}
.timer{font-family:var(--f-mono);font-weight:700;color:var(--orange)}
.qkind{color:var(--teal);font-weight:600;font-size:15px;margin-top:16px}
.qtext{font-family:var(--f-display);font-weight:500;font-size:clamp(18px,4vw,22px);margin:6px 0 14px;line-height:1.65}
.opts{display:grid;gap:10px}
.opt{border:2px solid var(--line);border-bottom-width:4px;background:var(--card);border-radius:14px;padding:12px 14px;min-height:56px;text-align:start;line-height:1.65;display:flex;gap:10px;align-items:flex-start}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt.sel{border-color:var(--teal);background:var(--teal-soft)}
.sheet{margin-top:auto;padding-top:16px}
.fb{border-radius:14px;padding:12px 14px;margin-bottom:12px}
.fb.ok{background:var(--good-soft)}.fb.no{background:var(--bad-soft)}
.fb b{font-family:var(--f-display);display:block}
.fb.ok b{color:var(--good)}.fb.no b{color:var(--bad)}
.sheet .btn{width:100%}
.result{text-align:center;margin:auto 0;display:flex;flex-direction:column;gap:14px;align-items:center;padding:20px 0}
.result h2{font-size:30px;color:var(--teal)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:440px}
.tile{border:2px solid var(--c,var(--line));border-radius:14px;overflow:hidden;background:var(--card)}
.tile small{display:block;background:var(--c);color:var(--card);font-weight:700;font-size:12.5px;padding:3px}
.tile b{display:block;padding:8px 4px;font-family:var(--f-display);font-size:24px}
/* flashcards */
.card3d{perspective:1200px;margin:10px 0}
.flip{position:relative;width:100%;min-height:250px;transition:transform .5s;transform-style:preserve-3d;border:none;background:none;padding:0;display:block}
.flip.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;border:2px solid var(--line);border-bottom-width:5px;background:var(--card);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;text-align:center;gap:8px}
.face.back{transform:rotateY(180deg);background:var(--teal-soft)}
.face b{font-family:var(--f-display);font-size:23px;font-weight:500}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mgrid .opt{justify-content:center;text-align:center;align-items:center;font-size:15.5px}
.mgrid .opt.gone{visibility:hidden}
/* spss sim */
.spss{border:1px solid #9aa4b1;border-radius:10px;overflow:hidden;background:#fff;color:#1b1b1b;direction:ltr;font-family:Segoe UI,Tahoma,sans-serif;font-size:13px}
.spss .tb{background:linear-gradient(#e9eef5,#d8e0ea);padding:5px 10px;font-weight:600;display:flex;gap:8px;align-items:center}
.spss .tb i{width:10px;height:10px;border-radius:50%;background:#c33;display:inline-block}
.spss .menu{display:flex;gap:2px;background:#f3f5f8;border-bottom:1px solid #c9d0d9;flex-wrap:wrap;position:relative}
.spss .menu button{background:none;border:none;padding:5px 9px;font-size:13px;color:#1b1b1b}
.spss .menu button:hover,.spss .menu button.on{background:#cfe0f5}
.spss .dd{position:absolute;top:100%;background:#fff;border:1px solid #9aa4b1;box-shadow:0 6px 18px rgba(0,0,0,.2);z-index:5;min-width:210px;padding:3px 0}
.spss .dd button{display:flex;justify-content:space-between;width:100%;text-align:left;background:none;border:none;padding:5px 14px;font-size:13px;color:#1b1b1b}
.spss .dd button:hover{background:#cfe0f5}
.spss .grid{overflow:auto;max-height:300px}
.spss table{border-collapse:collapse;width:100%;font-size:12.5px}
.spss th{background:#eef1f5;border:1px solid #c9d0d9;padding:3px 7px;font-weight:600;white-space:nowrap}
.spss td{border:1px solid #dde2e8;padding:3px 7px;white-space:nowrap}
.spss td.r{text-align:right}
.spss .bt{display:flex;gap:2px;background:#eef1f5;border-top:1px solid #c9d0d9;padding:3px}
.spss .bt button{border:1px solid #c9d0d9;background:#fff;padding:3px 12px;font-size:12.5px;color:#1b1b1b}
.spss .bt button.on{background:#cfe0f5;font-weight:700}
.otbl{border-collapse:collapse;margin:8px auto;font-size:13.5px;direction:ltr;background:#fff;color:#1b1b1b}
.otbl caption{font-weight:700;padding:4px;color:#1b1b1b}
.otbl th,.otbl td{border-top:1px solid #9aa4b1;border-bottom:1px solid #9aa4b1;padding:4px 9px;text-align:right;white-space:nowrap}
.otbl th{font-weight:600;background:#f3f5f8}
.otbl th[data-k]{cursor:help;text-decoration:underline dotted;text-underline-offset:3px}
.otbl th[data-k]:hover,.otbl th.on{background:#ffe8b3}
.otwrap{overflow-x:auto;background:#fff;border-radius:10px;border:1px solid var(--line);padding:6px}
.expl{background:var(--gold-soft);border-radius:10px;padding:10px 14px;margin-top:10px;min-height:52px}
/* glossary/search */
.search{width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card)}
.gl{border-bottom:1px dashed var(--line);padding:10px 2px}
.gl b{font-family:var(--f-display);font-weight:500}
.gl .en{display:inline;margin-inline-start:8px}
.gl p{margin:2px 0 0;color:var(--muted);font-size:15.5px}
mark{background:var(--gold-soft);color:var(--ink);border-radius:3px;padding:0 2px}
/* profile */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;background:var(--card)}
.badge .m{width:50px;height:50px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold);border:3px solid var(--gold);font-size:22px}
.badge.off{opacity:.45}.badge.off .m{background:var(--gray-soft);color:var(--muted);border-color:var(--line)}
.badge b{display:block;font-size:15px}.badge small{color:var(--muted);font-size:13px;line-height:1.5;display:block}
.pbar{height:9px;border-radius:9px;background:var(--gray-soft);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--gold);transition:width .4s}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px);text-align:center}
.foot{margin-top:30px;padding-top:14px;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:14.5px}
.wiz .opt{width:100%}
.path-crumb{display:flex;flex-wrap:wrap;gap:6px;align-items:center;direction:ltr;justify-content:flex-end;margin:8px 0}
.path-crumb span{background:var(--teal);color:var(--card);padding:3px 10px;border-radius:8px;font-family:var(--f-mono);font-size:13.5px}
.path-crumb em{color:var(--muted);font-style:normal}
.fab{position:fixed;left:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:25;display:flex;align-items:center;gap:8px;border:none;border-radius:999px;padding:10px 16px;background:linear-gradient(135deg,#6b4fd8,#2f5d8a);color:#fff;font-weight:700;box-shadow:0 8px 24px rgba(47,93,138,.35)}
.fab svg{width:22px;height:22px}
@media (min-width:681px){.fab{bottom:24px}}
.aiout{white-space:pre-wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px;min-height:48px;line-height:1.9}
.meth{display:grid;gap:10px}
.meth .opt{display:block;width:100%}
.meth .opt small{display:block;color:var(--muted);font-size:14.5px;line-height:1.6;margin-top:2px}
.meth .yr{font-family:var(--f-mono);font-size:13px;background:var(--gray-soft);border-radius:6px;padding:1px 8px;margin-inline-start:6px}
.qitem{border-bottom:1px dashed var(--line);padding:10px 0}
.qitem .sc{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.qitem .sc span{border:1px solid var(--line);border-radius:8px;padding:2px 10px;font-size:14px;background:var(--card)}
.rev{color:var(--orange);font-size:13px;font-weight:700}
body.taking .tabs,body.taking #aiFab,body.taking .stat,body.taking #fsBtn,body.taking .foot{display:none!important}
.tk-item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.tk-item.miss{border-color:var(--bad);background:var(--bad-soft)}
.tk-opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.tk-opts label{display:flex;gap:6px;align-items:center;border:2px solid var(--line);border-radius:10px;padding:6px 12px;cursor:pointer;background:var(--card);font-size:15.5px}
.tk-opts label:has(input:checked){border-color:var(--teal);background:var(--teal-soft);font-weight:600}
.tk-opts.col{flex-direction:column;align-items:stretch}
.codebox{direction:ltr;font-family:var(--f-mono);font-size:12.5px;word-break:break-all;background:var(--gray-soft);border-radius:10px;padding:10px;max-height:160px;overflow:auto}
.sapp .grid{max-height:440px}
.sapp .dd{max-height:72vh;overflow:auto;min-width:260px}
.sapp .dd button.sub{font-weight:600}
.sapp .dd button.sub span{margin-left:auto;padding-left:12px;transition:transform .15s}
.sapp .dd button.sub.open span{transform:rotate(90deg)}
.sapp .dd .subm{border-left:3px solid #cfe0f5;margin-left:10px}
.sapp .dd button.na{color:#777}
body.nogrid .sgrid td{border-color:transparent!important}
.sgrid table{border-collapse:collapse}
.sgrid thead th{position:sticky;top:0;z-index:1}
.sgrid tbody th{background:#eef1f5;position:sticky;left:0;min-width:46px}
.sgrid td{padding:0!important;min-width:84px}
.sgrid input,.sgrid select{width:100%;border:none;background:transparent;padding:4px 6px;font:13px "Segoe UI",Tahoma,sans-serif;color:#1b1b1b;min-width:80px}
.sgrid input:focus,.sgrid select:focus{outline:2px solid #4a90d9;background:#fffbe6}
.sgrid .delr,.sgrid .delv{border:none;background:none;color:#b0443a;font-weight:700;padding:0 4px;opacity:.35}
.sgrid tr:hover .delr,.sgrid .delv:hover{opacity:1}
.sgrid .addv{border:1px dashed #9aa4b1;background:#fff;border-radius:6px;padding:0 10px;font-weight:700}
.oblock{border:1px solid #c9d0d9;border-radius:10px;margin:10px;background:#fff;color:#1b1b1b;direction:ltr}
.oblock .oh{display:flex;gap:8px;align-items:center;padding:6px 10px;background:#f3f5f8;border-bottom:1px solid #c9d0d9;border-radius:10px 10px 0 0;flex-wrap:wrap}
.oblock .oh b{flex:1;min-width:160px}
.oblock .oh button{border:1px solid #c9d0d9;background:#fff;border-radius:7px;padding:2px 10px;font-size:12.5px;color:#1b1b1b}
.oblock .oh .ai{background:linear-gradient(135deg,#6b4fd8,#2f5d8a);color:#fff;border:none}
.oblock .ob{padding:6px 8px;overflow-x:auto}
.onote{direction:rtl;text-align:right;color:#3a3f45;background:#fff8e6;border-radius:8px;padding:6px 10px;margin:4px 8px 10px;font-family:var(--f-body);font-size:14px}
.vpick{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--card)}
.vpick label{display:flex;gap:8px;align-items:center;padding:3px 0;font-size:15px}
.vpick label span{color:var(--muted);font-size:13.5px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
@media print{.bar,.tabs,.lfoot,.foot{display:none}.sec .body{display:block!important}}
/* ===== Design system v2: "calibrated lab" ===== */
:root{
  --paper:#f2f4f7;--card:#ffffff;--ink:#0f1b2d;--muted:#536074;--line:#dbe1e9;
  --teal:#c2410c;--teal-soft:#ffedd5;--gold:#b7770a;--gold-soft:#fbf1dc;
  --good:#1f7a4d;--good-soft:#e2f2e8;--bad:#b23b33;--bad-soft:#fbe7e5;
  --violet:#4b4fa3;--violet-soft:#ebecf8;--orange:#b5591f;--orange-soft:#fbebe0;--gray-soft:#eceff3;
  --c1:#c2410c;--c2:#d18a0b;--c3:#1f7a4d;
  --navy:#0b1220;--navy-2:#16213a;--hero-grid:#1d2a44;--hero-axis:#7f93ad;--hero-curve:#fb923c;--hero-bar:rgba(251,191,36,.30);--hero-ink:#eaf1f8;--hero-muted:#a9b8cb;
  --f-display:"Noto Kufi Arabic","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --r:16px;--r-sm:10px;
  --shadow:0 1px 2px rgba(15,27,45,.06),0 8px 24px -12px rgba(15,27,45,.18);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0b1320;--card:#121d2e;--ink:#e6edf5;--muted:#9fb0c4;--line:#24344b;
  --teal:#fb923c;--teal-soft:#3a2010;--gold:#f0b43d;--gold-soft:#2c2412;
  --good:#6fd39b;--good-soft:#14301f;--bad:#f08a80;--bad-soft:#3a1d1b;
  --violet:#a9adf0;--violet-soft:#22244a;--orange:#f2a172;--orange-soft:#3a2416;--gray-soft:#1a2639;
  --c1:#fb923c;--c2:#f0b43d;--c3:#6fd39b;--navy:#08101b;--navy-2:#0f1a2b;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6)}}
:root[data-theme="dark"]{
  --paper:#0b1320;--card:#121d2e;--ink:#e6edf5;--muted:#9fb0c4;--line:#24344b;
  --teal:#fb923c;--teal-soft:#3a2010;--gold:#f0b43d;--gold-soft:#2c2412;
  --good:#6fd39b;--good-soft:#14301f;--bad:#f08a80;--bad-soft:#3a1d1b;
  --violet:#a9adf0;--violet-soft:#22244a;--orange:#f2a172;--orange-soft:#3a2416;--gray-soft:#1a2639;
  --c1:#fb923c;--c2:#f0b43d;--c3:#6fd39b;--navy:#08101b;--navy-2:#0f1a2b;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6)}
body{line-height:1.8}
.num{font-family:var(--f-body);font-variant-numeric:tabular-nums lining-nums}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:700;letter-spacing:0}
.wrap{max-width:1040px}
.bar{background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px)}
.bar .in{max-width:1040px}
.brand{color:var(--ink);font-weight:700;font-size:18px}
.brand svg rect{fill:var(--navy)}
.stat{background:transparent;border:1px solid var(--line)}
/* tabs as segmented instrument switch */
.tabs{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:5px;gap:4px;box-shadow:var(--shadow)}
.tab{border:none;background:transparent;border-radius:10px;min-height:44px;color:var(--muted)}
.tab:hover{color:var(--ink);background:var(--gray-soft)}
.tab[aria-selected="true"]{background:var(--navy);color:#fff}
:root[data-theme="dark"] .tab[aria-selected="true"]{background:var(--teal);color:#1c0a02}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tab[aria-selected="true"]{background:var(--teal);color:#1c0a02}}
@media (max-width:680px){.tabs{border-radius:0;box-shadow:0 -6px 20px -12px rgba(15,27,45,.35);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}.tab{min-height:52px}}
/* buttons: flat, precise */
.btn{border-radius:var(--r-sm);box-shadow:none;min-height:46px;font-weight:600;transition:background-color .15s,transform .1s}
.btn:hover{background:color-mix(in srgb,var(--teal) 86%,#000)}
.btn:active{transform:translateY(1px);box-shadow:none}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{background:var(--gray-soft)}
.btn.gold{background:var(--gold);box-shadow:none;color:#fff}
.btn.sm{min-height:40px}
.panel{border-radius:var(--r);box-shadow:var(--shadow);border-color:var(--line)}
.panel>h3{font-size:19px}
.chip{border-radius:6px}
/* hero instrument */
.hero2{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px;align-items:center;background:var(--navy);color:var(--hero-ink);border-radius:22px;padding:30px 30px 26px;margin:6px 0 16px;position:relative;overflow:hidden;box-shadow:0 30px 60px -30px rgba(15,27,45,.55)}
:root[data-theme="dark"] .hero2{border:1px solid var(--line)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero2{border:1px solid var(--line)}}
.hero2::before{content:"";position:absolute;inset:0;background:radial-gradient(600px 300px at 15% 110%,rgba(251,146,60,.22),transparent 60%),radial-gradient(500px 260px at 95% -20%,rgba(244,63,94,.16),transparent 60%);pointer-events:none}
.hero2-kicker{margin:0 0 6px;color:var(--hero-muted);font-size:15px}
.hero2 h1{font-size:clamp(30px,5.4vw,46px);line-height:1.2;margin:0 0 12px;color:#fff}
.hero2-lead{color:#c9d6e5;margin:0 0 20px;max-width:46ch;font-size:17.5px}
.hero2 .btn{background:var(--hero-curve);color:#062221}
.hero2 .btn:hover{background:#7fe3d5}
.hero2 .btn.ghost{background:transparent;color:#fff;border-color:#33496a}
.hero2 .btn.ghost:hover{background:#1a2c45}
.readouts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;margin-top:22px;background:#24395a;border:1px solid #24395a;border-radius:12px;overflow:hidden}
.readouts div{background:var(--navy-2);padding:10px 12px;position:relative}
.readouts span{display:block;color:var(--hero-muted);font-size:13px}
.readouts b{font-size:21px;color:#fff;font-weight:600}
.readouts i{position:absolute;inset:auto 0 0 auto;height:3px;width:var(--p);background:var(--hero-curve)}
.hero2-art{position:relative}
.hero-svg{direction:ltr;width:100%;height:auto;display:block;border-radius:14px;background:var(--navy-2);border:1px solid #213654}
.htick{fill:var(--hero-muted);font-size:12px;font-family:"IBM Plex Sans Arabic",sans-serif}
.hnote{fill:var(--hero-curve);font-size:12px;font-weight:600}
.hero2-cap{margin:10px 2px 0;color:var(--hero-muted);font-size:14.5px}
.hero2-cap b{color:#fff;font-weight:600}
.hcurve{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 1.6s .35s cubic-bezier(.3,.7,.2,1) forwards}
.hbar{transform-origin:center bottom;transform-box:fill-box;transform:scaleY(0);animation:rise .6s var(--d) cubic-bezier(.2,.8,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes rise{to{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.hcurve{stroke-dashoffset:0;animation:none}.hbar{transform:none;animation:none}}
@media (max-width:760px){.hero2{grid-template-columns:1fr;padding:22px 18px}.readouts{grid-template-columns:repeat(2,1fr)}.hero2-art{order:-1}}
/* tool strip */
.toolstrip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.toolstrip button{display:flex;gap:10px;align-items:flex-start;text-align:start;background:none;border:none;border-inline-start:1px solid var(--line);padding:14px 14px;min-height:72px;color:var(--ink)}
.toolstrip button:first-child{border-inline-start:none}
.toolstrip button:hover{background:var(--gray-soft)}
.toolstrip svg{width:26px;height:26px;flex:none;color:var(--teal);margin-top:2px}
.toolstrip b{display:block;font-family:var(--f-display);font-size:15.5px;font-weight:700}
.toolstrip small{display:block;color:var(--muted);font-size:13px;line-height:1.5}
@media (max-width:900px){.toolstrip{grid-template-columns:1fr 1fr}.toolstrip button{border-inline-start:none;border-top:1px solid var(--line)}.toolstrip button:nth-child(-n+2){border-top:none}.toolstrip button:nth-child(even){border-inline-start:1px solid var(--line)}}
.sec-title{font-size:22px}
/* ruler path */

.unit2{display:flex;align-items:center;gap:12px;margin:26px 0 8px;position:relative}

.node2:hover{border-color:var(--teal)}
.node2::before{content:"";position:absolute;inset-inline-start:-21px;top:50%;width:14px;height:2px;background:var(--line)}
.node2 .tick{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);color:var(--muted);font-weight:700;font-size:14px;background:var(--card)}
.node2 .tick svg{width:16px;height:16px}
.node2.done .tick{background:var(--good);border-color:var(--good);color:#fff}
.node2.current{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
.node2.current .tick{border-color:var(--teal);color:var(--teal)}
.node2 .meta2 b{display:block;font-family:var(--f-display);font-weight:600;font-size:16.5px;line-height:1.5}
.node2 .meta2 small{display:block;color:var(--muted);font-size:13.5px}
.node2 .here{margin-inline-start:auto;font-size:13px;font-weight:700;color:var(--teal);white-space:nowrap}
/* lesson & labs polish */
.lhead{border-radius:var(--r);box-shadow:var(--shadow);border-top:4px solid var(--teal)}

.sec.open{box-shadow:var(--shadow)}

.box{border-radius:10px}

.foot{border-top:none}

function histSVG(arr,opts={}){

function curveSVG(kind){

$("#fsBtn").onclick=()=>{const steps=[1,1.12,1.25,0.92];S.fs=steps[(steps.indexOf(S.fs||1)+1)%steps.length];applyFs();save();toast("حجم الخط: "+Math.round(S.fs*100)+"%")};
function applyTheme(){const t=localStorage.getItem("statlab-theme");if(t)document.documentElement.dataset.theme=t}
$("#thBtn").onclick=()=>{const dark=document.documentElement.dataset.theme?document.documentElement.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;const n=dark?"light":"dark";document.documentElement.dataset.theme=n;try{localStorage.setItem("statlab-theme",n)}catch(e){}};
try{applyTheme()}catch(e){}

requestAnimationFrame(()=>requestAnimationFrame(()=>{window.__painted=1}));

window.addEventListener("privacy-accepted",()=>{if(typeof KNOW==="undefined")needChunks(chunksFor(["know"])).then(()=>KNOW.sync(),()=>{});if(typeof TESTS==="undefined")needChunks(chunksFor(["tests"])).then(()=>TESTS.sync(),()=>{})});
